name: DB Check

on: push

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la base
        run: bash db/setup.sh

      - name: Afficher les étudiants
        run: psql -h localhost -U postgres -d tp -c "SELECT * FROM students;"
        env:
          PGPASSWORD: postgres